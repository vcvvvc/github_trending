        :root {

            --link-color: #58a6ff;

            --grid-color: rgba(255, 255, 255, 0.05);

            body {

            margin: 0;
            padding: 20px;

            background-size: 30px 30px;
        }

        .container {
            max-width: 1200px;
                margin: 0 auto;
            }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #logo-link {
            color: var(--text-color);
            display: flex;
            align-items: center;
        }
        #logo-link:hover {
            opacity: 0.7;
        }
        #logo-link svg {
             width: 32px;
             height: 32px;
        }

        h1 {
            margin: 0;
            font-size: 1.5em;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        

        
        #theme-toggle {
            cursor: pointer;
            font-size: 24px;
        }

        .history-link {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .history-link:hover {
            background-color: var(--link-color);
            color: white;
            border-color: var(--link-color);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .dashboard {

            gap: 30px;
        }

        .sidebar {

                padding: 20px;
            border-radius: 8px;
            height: fit-content;
            border: 1px solid var(--card-border);

        #lang-chart {

        .filters {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;

        .filter-btn {

            cursor: pointer;
            transition: all 0.2s;

        .filter-btn:hover {
            opacity: 0.8;

            background-color: var(--link-color);

            border-color: var(--link-color);

        .main-content {
            display: flex;
            flex-direction: column;
        }

        .toolbar {

        }

        .repo-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: transform 0.3s ease-out, box-shadow 0.3s ease-out, border-color 0.3s;
            animation: fadeIn 0.5s ease-in-out;
        }
        .repo-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .repo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .repo-name {
            font-size: 1.2em;
            font-weight: bold;
            display: flex;
            align-items: baseline;
        }
        .repo-name a {
            color: var(--link-color);
            text-decoration: none;
        }
        .repo-name a:hover {
            text-decoration: underline;
        }
        
        .repo-serial {
            font-size: 1em;
            margin-right: 8px;
            opacity: 0.7;
            font-weight: normal;
        }
        
        .repo-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 8px;
            font-size: 0.9em;
            color: var(--text-color);
            opacity: 0.8;
        }
        
        .repo-language-tag {
            padding: 3px 8px;
            background-color: var(--link-color);
            color: white;
            border-radius: 10px;
            font-size: 0.85em;
            font-weight: bold;

            padding: 3px 8px;

            background-color: var(--border-color);

        .repo-desc {
            margin-top: 10px;
            font-size: 0.9em;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.9em;
        }

        @media (max-width: 992px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #to-top-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(145deg, var(--link-color), var(--link-hover-color));
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s ease-out;

        }

        #to-top-btn.show {
            opacity: 1;
            visibility: visible;

        }

        #to-top-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);

        #to-top-btn:hover svg {
            transform: scale(1.1);
        }

"ID":108,"URL":"https://github.com/foundry-rs/forge-std","Name":"foundry-rs/forge-std","Language":"Solidity","Stars":962,"Description":"A collection of helpful contracts and libraries for use with Forge and Foundry"},{"ID":109,"URL":"https://github.com/Arachnid/solidity-stringutils","Name":"Arachnid/solidity-stringutils","Language":"Solidity","Stars":1155,"Description":"Basic string utilities for Solidity"},{"ID":110,"URL":"https://github.com/GNSPS/solidity-bytes-utils","Name":"GNSPS/solidity-bytes-utils","Language":"Solidity","Stars":555,"Description":"Utility Solidity library composed of basic operations for tightly packed bytes arrays"},{"ID":111,"URL":"https://github.com/PaulRBerg/prb-math","Name":"PaulRBerg/prb-math","Language":"Solidity","Stars":971,"Description":"Solidity library for advanced fixed-point math"},{"ID":112,"URL":"https://github.com/OpenZeppelin/openzeppelin-foundry-upgrades","Name":"OpenZeppelin/openzeppelin-foundry-upgrades","Language":"Solidity","Stars":230,"Description":"Foundry library for deploying and managing upgradeable contracts"},{"ID":113,"URL":"https://github.com/smartcontractkit/chainlink-evm","Name":"smartcontractkit/chainlink-evm","Language":"Solidity","Stars":50,"Description":""}]}];
        let myChart;

        document.addEventListener('DOMContentLoaded', () => {
            
            renderAll();

            
            setupThemeToggle();
            setupSort();
            setupChart();
            setupFilters();
            setupBackToTopButton();
            setupLogoLink();
        });

        function renderAll() {
            renderRepoCards(groupsData, 'default');
            updateActiveFilterButton('all');
        }

        function setupThemeToggle() {
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.addEventListener('click', () => {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    html.classList.add('light');
                    themeToggle.textContent = '🌙';
                } else {
                    html.classList.remove('light');
                    html.classList.add('dark');
                    themeToggle.textContent = '☀️';
                }

                if (myChart) {
                    const newColor = getComputedStyle(document.body).getPropertyValue('--text-color');
                    myChart.options.plugins.legend.labels.color = newColor;
                    myChart.update();
                }
            });
        }

        function setupSort() {
            const sortBy = document.getElementById('sort-by');
            sortBy.addEventListener('change', (e) => {
                const lang = document.querySelector('.filter-btn.active').dataset.lang;
                const sortMethod = e.target.value;
                if (lang === 'all') {
                    renderRepoCards(groupsData, sortMethod);
                } else {
                    const filteredData = groupsData.filter(g => g.GroupName === lang);
                    renderRepoCards(filteredData, sortMethod);
                }
            });
        }

        function setupFilters() {
            const filtersContainer = document.getElementById('filters-container');
            groupsData.forEach(group => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.lang = group.GroupName;
                btn.textContent = group.GroupName;
                btn.addEventListener('click', () => {
                    filterByLanguage(group.GroupName);
                });
                filtersContainer.appendChild(btn);
            });

            document.querySelector('.filter-btn[data-lang="all"]').addEventListener('click', () => {
                renderAll();
                document.getElementById('sort-by').value = 'default';
            });
        }

        function filterByLanguage(lang) {
            const filteredData = groupsData.filter(g => g.GroupName === lang);
            renderRepoCards(filteredData, document.getElementById('sort-by').value);
            updateActiveFilterButton(lang);
        }

        function updateActiveFilterButton(lang) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.filter-btn[data-lang="${lang}"]`).classList.add('active');
        }

        function setupChart() {
            const ctx = document.getElementById('lang-chart').getContext('2d');
            const labels = groupsData.map(g => g.GroupName);
            const data = groupsData.map(g => g.Repos.length);
            const textColor = getComputedStyle(document.body).getPropertyValue('--text-color');

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Repos per language',
                        data: data,
                        backgroundColor: [
                            '#3498db', '#f1c40f', '#2ecc71', '#e74c3c', '#9b59b6',
                            '#34495e', '#1abc9c', '#e67e22', '#d35400', '#c0392b'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: textColor
                            }
                        },
                        title: {
                            display: false
                        }
                    },
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const chartElement = elements[0];
                            const lang = myChart.data.labels[chartElement.index];
                            filterByLanguage(lang);
                        }
                    }
                }
            });
        }

        function renderRepoCards(data, sortBy) {
            const repoList = document.getElementById('repo-list');
            repoList.innerHTML = '';

            let allRepos = data.flatMap(g => g.Repos);

            if (sortBy === 'stars') {
                allRepos.sort((a, b) => b.Stars - a.Stars);
            } else if (sortBy === 'name') {
                allRepos.sort((a, b) => a.Name.localeCompare(b.Name));
            }

            if(allRepos.length === 0) {
                repoList.innerHTML = '<p>No repositories found for this selection.</p>';
                return;
            }

            allRepos.forEach(repo => {
                const card = document.createElement('div');
                card.className = 'repo-card';
                card.innerHTML = `
                    <div class="repo-header">
                        <div class="repo-name">
                            <span class="repo-serial">${allRepos.indexOf(repo) + 1}.</span>
                            <a href="${repo.URL}" target="_blank">${repo.Name}</a>
                        </div>
                        <span class="repo-stars">🌟 ${repo.Stars}</span>
                    </div>
                    <div class="repo-meta">
                        ${repo.Language ? `<span class="repo-language-tag">${repo.Language}</span>` : ''}
                    </div>
                    <div class="repo-desc">${repo.Description || ''}</div>
                `;
                repoList.appendChild(card);
            });
        }

        function setupBackToTopButton() {
            const btn = document.getElementById('to-top-btn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    btn.classList.add('show');
                } else {
                    btn.classList.remove('show');
                }
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function setupLogoLink() {
            const logo = document.getElementById('logo-link');
            logo.addEventListener('click', (e) => {
                e.preventDefault();
                renderAll();
                document.getElementById('sort-by').value = 'default';
            });
        }
    </script>
</body>
</html>
