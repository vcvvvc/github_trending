:"Solidity","Stars":1155,"Description":"Basic string utilities for Solidity"},{"ID":99,"URL":"https://github.com/OpenZeppelin/openzeppelin-contracts","Name":"OpenZeppelin/openzeppelin-contracts","Language":"Solidity","Stars":26104,"Description":"OpenZeppelin Contracts is a library for secure smart contract development."},{"ID":100,"URL":"https://github.com/Vectorized/solady","Name":"Vectorized/solady","Language":"Solidity","Stars":3030,"Description":"Optimized Solidity snippets."},{"ID":101,"URL":"https://github.com/Uniswap/v2-periphery","Name":"Uniswap/v2-periphery","Language":"Solidity","Stars":1212,"Description":"🎚 Peripheral smart contracts for interacting with Uniswap V2"},{"ID":102,"URL":"https://github.com/dmfxyz/murky","Name":"dmfxyz/murky","Language":"Solidity","Stars":478,"Description":"Merkle Proof Generator and Validator in Solidity"},{"ID":103,"URL":"https://github.com/ethereum-optimism/superchain-ops","Name":"ethereum-optimism/superchain-ops","Language":"Solidity","Stars":74,"Description":"superchain-ops allows builders to create and execute tasks on EVM chains."},{"ID":104,"URL":"https://github.com/pancakeswap/infinity-core","Name":"pancakeswap/infinity-core","Language":"Solidity","Stars":94,"Description":""},{"ID":105,"URL":"https://github.com/aerodrome-finance/contracts","Name":"aerodrome-finance/contracts","Language":"Solidity","Stars":70,"Description":"Aerodrome Finance Smart Contracts"},{"ID":106,"URL":"https://github.com/celo-org/celo-monorepo","Name":"celo-org/celo-monorepo","Language":"Solidity","Stars":736,"Description":"Official repository for core projects comprising the Celo platform"},{"ID":107,"URL":"https://github.com/AmazingAng/WTF-Solidity","Name":"AmazingAng/WTF-Solidity","Language":"Solidity","Stars":13007,"Description":"WTF Solidity 极简入门教程，供小白们使用。Now supports English! 官网: https://wtf.academy"},{"ID":108,"URL":"https://github.com/transmissions11/solmate","Name":"transmissions11/solmate","Language":"Solidity","Stars":4176,"Description":"Modern, opinionated, and gas optimized building blocks for smart contract development."},{"ID":109,"URL":"https://github.com/OpenZeppelin/openzeppelin-foundry-upgrades","Name":"OpenZeppelin/openzeppelin-foundry-upgrades","Language":"Solidity","Stars":223,"Description":"Foundry library for deploying and managing upgradeable contracts"},{"ID":110,"URL":"https://github.com/matter-labs/v2-testnet-contracts","Name":"matter-labs/v2-testnet-contracts","Language":"Solidity","Stars":67,"Description":""},{"ID":111,"URL":"https://github.com/Layr-Labs/eigenlayer-middleware","Name":"Layr-Labs/eigenlayer-middleware","Language":"Solidity","Stars":110,"Description":""}]}];
        let myChart;

        document.addEventListener('DOMContentLoaded', () => {
            
            renderAll();
            
            
            setupThemeToggle();
            setupSort();
            setupChart();
            setupFilters();
            setupBackToTopButton();
            setupLogoLink();
        });

        function renderAll() {
            renderRepoCards(groupsData, 'default');
            updateActiveFilterButton('all');
        }

        function setupThemeToggle() {
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.addEventListener('click', () => {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    html.classList.add('light');
                    themeToggle.textContent = '🌙';
                } else {
                    html.classList.remove('light');
                    html.classList.add('dark');
                    themeToggle.textContent = '☀️';
                }

                if (myChart) {
                    const newColor = getComputedStyle(document.body).getPropertyValue('--text-color');
                    myChart.options.plugins.legend.labels.color = newColor;
                    myChart.update();
                }
            });
        }
        
        function setupSort() {
            const sortBy = document.getElementById('sort-by');
            sortBy.addEventListener('change', (e) => {
                const lang = document.querySelector('.filter-btn.active').dataset.lang;
                const sortMethod = e.target.value;
                if (lang === 'all') {
                    renderRepoCards(groupsData, sortMethod);
                } else {
                    const filteredData = groupsData.filter(g => g.GroupName === lang);
                    renderRepoCards(filteredData, sortMethod);
                }
            });
        }

        function setupFilters() {
            const filtersContainer = document.getElementById('filters-container');
            groupsData.forEach(group => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.lang = group.GroupName;
                btn.textContent = group.GroupName;
                btn.addEventListener('click', () => {
                    filterByLanguage(group.GroupName);
                });
                filtersContainer.appendChild(btn);
            });

            document.querySelector('.filter-btn[data-lang="all"]').addEventListener('click', () => {
                renderAll();
                document.getElementById('sort-by').value = 'default';
            });
        }
        
        function filterByLanguage(lang) {
            const filteredData = groupsData.filter(g => g.GroupName === lang);
            renderRepoCards(filteredData, document.getElementById('sort-by').value);
            updateActiveFilterButton(lang);
        }

        function updateActiveFilterButton(lang) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.filter-btn[data-lang="${lang}"]`).classList.add('active');
        }

        function setupChart() {
            const ctx = document.getElementById('lang-chart').getContext('2d');
            const labels = groupsData.map(g => g.GroupName);
            const data = groupsData.map(g => g.Repos.length);
            const textColor = getComputedStyle(document.body).getPropertyValue('--text-color');

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Repos per language',
                        data: data,
                        backgroundColor: [
                            '#3498db', '#f1c40f', '#2ecc71', '#e74c3c', '#9b59b6',
                            '#34495e', '#1abc9c', '#e67e22', '#d35400', '#c0392b'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: textColor
                            }
                        },
                        title: {
                            display: false
                        }
                    },
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const chartElement = elements[0];
                            const lang = myChart.data.labels[chartElement.index];
                            filterByLanguage(lang);
                        }
                    }
                }
            });
        }

        function renderRepoCards(data, sortBy) {
            const repoList = document.getElementById('repo-list');
            repoList.innerHTML = '';
            
            let allRepos = data.flatMap(g => g.Repos);
            
            if (sortBy === 'stars') {
                allRepos.sort((a, b) => b.Stars - a.Stars);
            } else if (sortBy === 'name') {
                allRepos.sort((a, b) => a.Name.localeCompare(b.Name));
            }

            if(allRepos.length === 0) {
                repoList.innerHTML = '<p>No repositories found for this selection.</p>';
                return;
            }

            allRepos.forEach(repo => {
                const card = document.createElement('div');
                card.className = 'repo-card';
                card.innerHTML = `
                    <div class="repo-header">
                        <div class="repo-name">
                            <span class="repo-serial">${allRepos.indexOf(repo) + 1}.</span>
                            <a href="${repo.URL}" target="_blank">${repo.Name}</a>
                        </div>
                        <span class="repo-stars">🌟 ${repo.Stars}</span>
                    </div>
                    <div class="repo-meta">
                        ${repo.Language ? `<span class="repo-language-tag">${repo.Language}</span>` : ''}
                    </div>
                    <div class="repo-desc">${repo.Description || ''}</div>
                `;
                repoList.appendChild(card);
            });
        }

        function setupBackToTopButton() {
            const btn = document.getElementById('to-top-btn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    btn.classList.add('show');
                } else {
                    btn.classList.remove('show');
                }
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function setupLogoLink() {
            const logo = document.getElementById('logo-link');
            logo.addEventListener('click', (e) => {
                e.preventDefault();
                renderAll();
                document.getElementById('sort-by').value = 'default';
            });
        }
    </script>
