 and powerful"}]},{"GroupName":"Solidity","Repos":[{"ID":87,"URL":"https://github.com/Uniswap/v4-core","Name":"Uniswap/v4-core","Language":"Solidity","Stars":2444,"Description":"🦄 🦄 🦄 🦄 Core smart contracts of Uniswap v4"},{"ID":88,"URL":"https://github.com/Polymarket/ctf-exchange","Name":"Polymarket/ctf-exchange","Language":"Solidity","Stars":302,"Description":"Polymarket CTF Exchange"},{"ID":89,"URL":"https://github.com/PaulRBerg/prb-math","Name":"PaulRBerg/prb-math","Language":"Solidity","Stars":992,"Description":"Solidity library for advanced fixed-point math"},{"ID":90,"URL":"https://github.com/hiero-ledger/hiero-improvement-proposals","Name":"hiero-ledger/hiero-improvement-proposals","Language":"Solidity","Stars":176,"Description":"Hiero Improvement Proposal"},{"ID":91,"URL":"https://github.com/Uniswap/permit2","Name":"Uniswap/permit2","Language":"Solidity","Stars":912,"Description":"🔑🔑🔑 next generation token approvals mechanism"},{"ID":92,"URL":"https://github.com/OpenZeppelin/openzeppelin-contracts","Name":"OpenZeppelin/openzeppelin-contracts","Language":"Solidity","Stars":26977,"Description":"OpenZeppelin Contracts is a library for secure smart contract development."},{"ID":93,"URL":"https://github.com/OffchainLabs/nitro-contracts","Name":"OffchainLabs/nitro-contracts","Language":"Solidity","Stars":151,"Description":"The core Arbitrum Nitro contracts deployed to the parent chain to host the rollup"},{"ID":94,"URL":"https://github.com/Arachnid/solidity-stringutils","Name":"Arachnid/solidity-stringutils","Language":"Solidity","Stars":1156,"Description":"Basic string utilities for Solidity"},{"ID":95,"URL":"https://github.com/Uniswap/v4-periphery","Name":"Uniswap/v4-periphery","Language":"Solidity","Stars":863,"Description":"🦄 🦄 🦄 🦄 Peripheral smart contracts for interacting with Uniswap v4"},{"ID":96,"URL":"https://github.com/Vectorized/solady","Name":"Vectorized/solady","Language":"Solidity","Stars":3276,"Description":"Optimized Solidity snippets."},{"ID":97,"URL":"https://github.com/dmfxyz/murky","Name":"dmfxyz/murky","Language":"Solidity","Stars":502,"Description":"Merkle Proof Generator and Validator in Solidity"},{"ID":98,"URL":"https://github.com/matter-labs/era-contracts","Name":"matter-labs/era-contracts","Language":"Solidity","Stars":529,"Description":"Smart Contract Submodule For zkSync Era"},{"ID":99,"URL":"https://github.com/matter-labs/v2-testnet-contracts","Name":"matter-labs/v2-testnet-contracts","Language":"Solidity","Stars":68,"Description":""},{"ID":100,"URL":"https://github.com/pendle-finance/pendle-core-v2-public","Name":"pendle-finance/pendle-core-v2-public","Language":"Solidity","Stars":204,"Description":""}]}];
        let myChart;

        document.addEventListener('DOMContentLoaded', () => {
            
            renderAll();

            
            setupThemeToggle();
            setupSort();
            setupChart();
            setupFilters();
            setupBackToTopButton();
            setupLogoLink();
        });

        function renderAll() {
            renderRepoCards(groupsData, 'default');
            updateActiveFilterButton('all');
        }

        function setupThemeToggle() {
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.addEventListener('click', () => {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    html.classList.add('light');
                    themeToggle.textContent = '🌙';
                } else {
                    html.classList.remove('light');
                    html.classList.add('dark');
                    themeToggle.textContent = '☀️';
                }

                if (myChart) {
                    const newColor = getComputedStyle(document.body).getPropertyValue('--text-color');
                    myChart.options.plugins.legend.labels.color = newColor;
                    myChart.update();
                }
            });
        }

        function setupSort() {
            const sortBy = document.getElementById('sort-by');
            sortBy.addEventListener('change', (e) => {
                const lang = document.querySelector('.filter-btn.active').dataset.lang;
                const sortMethod = e.target.value;
                if (lang === 'all') {
                    renderRepoCards(groupsData, sortMethod);
                } else {
                    const filteredData = groupsData.filter(g => g.GroupName === lang);
                    renderRepoCards(filteredData, sortMethod);
                }
            });
        }

        function setupFilters() {
            const filtersContainer = document.getElementById('filters-container');
            groupsData.forEach(group => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.lang = group.GroupName;
                btn.textContent = group.GroupName;
                btn.addEventListener('click', () => {
                    filterByLanguage(group.GroupName);
                });
                filtersContainer.appendChild(btn);
            });

            document.querySelector('.filter-btn[data-lang="all"]').addEventListener('click', () => {
                renderAll();
                document.getElementById('sort-by').value = 'default';
            });
        }

        function filterByLanguage(lang) {
            const filteredData = groupsData.filter(g => g.GroupName === lang);
            renderRepoCards(filteredData, document.getElementById('sort-by').value);
            updateActiveFilterButton(lang);
        }

        function updateActiveFilterButton(lang) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.filter-btn[data-lang="${lang}"]`).classList.add('active');
        }

        function setupChart() {
            const ctx = document.getElementById('lang-chart').getContext('2d');
            const labels = groupsData.map(g => g.GroupName);
            const data = groupsData.map(g => g.Repos.length);
            const textColor = getComputedStyle(document.body).getPropertyValue('--text-color');

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Repos per language',
                        data: data,
                        backgroundColor: [
                            '#3498db', '#f1c40f', '#2ecc71', '#e74c3c', '#9b59b6',
                            '#34495e', '#1abc9c', '#e67e22', '#d35400', '#c0392b'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: textColor
                            }
                        },
                        title: {
                            display: false
                        }
                    },
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const chartElement = elements[0];
                            const lang = myChart.data.labels[chartElement.index];
                            filterByLanguage(lang);
                        }
                    }
                }
            });
        }

        function renderRepoCards(data, sortBy) {
            const repoList = document.getElementById('repo-list');
            repoList.innerHTML = '';

            let allRepos = data.flatMap(g => g.Repos);

            if (sortBy === 'stars') {
                allRepos.sort((a, b) => b.Stars - a.Stars);
            } else if (sortBy === 'name') {
                allRepos.sort((a, b) => a.Name.localeCompare(b.Name));
            }

            if(allRepos.length === 0) {
                repoList.innerHTML = '<p>No repositories found for this selection.</p>';
                return;
            }

            allRepos.forEach(repo => {
                const card = document.createElement('div');
                card.className = 'repo-card';
                card.innerHTML = `
                    <div class="repo-header">
                        <div class="repo-name">
                            <span class="repo-serial">${allRepos.indexOf(repo) + 1}.</span>
                            <a href="${repo.URL}" target="_blank">${repo.Name}</a>
                        </div>
                        <span class="repo-stars">🌟 ${repo.Stars}</span>
                    </div>
                    <div class="repo-meta">
                        ${repo.Language ? `<span class="repo-language-tag">${repo.Language}</span>` : ''}
                    </div>
                    <div class="repo-desc">${repo.Description || ''}</div>
                `;
                repoList.appendChild(card);
            });
        }

        function setupBackToTopButton() {
            const btn = document.getElementById('to-top-btn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    btn.classList.add('show');
                } else {
                    btn.classList.remove('show');
                }
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function setupLogoLink() {
            const logo = document.getElementById('logo-link');
            logo.addEventListener('click', (e) => {
                e.preventDefault();
                renderAll();
                document.getElementById('sort-by').value = 'default';
            });
        }
    </script>
</body>
</html>
