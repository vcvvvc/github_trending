        }

        }
        
        .repo-serial {

            opacity: 0.7;
            font-weight: normal;

        .repo-meta {

            border-top: 1px solid var(--border-color);
            font-size: 0.9em;

            }
            to {
                opacity: 1;
                transform: translateY(0);
            }

,"Stars":2312,"Description":"🦄 🦄 🦄 🦄 Core smart contracts of Uniswap v4"},{"ID":106,"URL":"https://github.com/transmissions11/solmate","Name":"transmissions11/solmate","Language":"Solidity","Stars":4200,"Description":"Modern, opinionated, and gas optimized building blocks for smart contract development."},{"ID":107,"URL":"https://github.com/dapphub/ds-test","Name":"dapphub/ds-test","Language":"Solidity","Stars":229,"Description":"Assertions, equality checks and other test helpers"},{"ID":108,"URL":"https://github.com/dmfxyz/murky","Name":"dmfxyz/murky","Language":"Solidity","Stars":481,"Description":"Merkle Proof Generator and Validator in Solidity"},{"ID":109,"URL":"https://github.com/foundry-rs/forge-std","Name":"foundry-rs/forge-std","Language":"Solidity","Stars":956,"Description":"A collection of helpful contracts and libraries for use with Forge and Foundry"},{"ID":110,"URL":"https://github.com/Vectorized/solady","Name":"Vectorized/solady","Language":"Solidity","Stars":3081,"Description":"Optimized Solidity snippets."},{"ID":111,"URL":"https://github.com/GNSPS/solidity-bytes-utils","Name":"GNSPS/solidity-bytes-utils","Language":"Solidity","Stars":549,"Description":"Utility Solidity library composed of basic operations for tightly packed bytes arrays"},{"ID":112,"URL":"https://github.com/Uniswap/v2-periphery","Name":"Uniswap/v2-periphery","Language":"Solidity","Stars":1224,"Description":"🎚 Peripheral smart contracts for interacting with Uniswap V2"},{"ID":113,"URL":"https://github.com/Layr-Labs/eigenlayer-contracts","Name":"Layr-Labs/eigenlayer-contracts","Language":"Solidity","Stars":691,"Description":"Contracts of EigenLayer"},{"ID":114,"URL":"https://github.com/Arachnid/solidity-stringutils","Name":"Arachnid/solidity-stringutils","Language":"Solidity","Stars":1155,"Description":"Basic string utilities for Solidity"},{"ID":115,"URL":"https://github.com/OffchainLabs/nitro-contracts","Name":"OffchainLabs/nitro-contracts","Language":"Solidity","Stars":135,"Description":"The core Arbitrum Nitro contracts deployed to the parent chain to host the rollup"},{"ID":116,"URL":"https://github.com/Layr-Labs/eigenlayer-middleware","Name":"Layr-Labs/eigenlayer-middleware","Language":"Solidity","Stars":110,"Description":""},{"ID":117,"URL":"https://github.com/smartcontractkit/chainlink-evm","Name":"smartcontractkit/chainlink-evm","Language":"Solidity","Stars":45,"Description":""},{"ID":118,"URL":"https://github.com/taikoxyz/taiko-mono","Name":"taikoxyz/taiko-mono","Language":"Solidity","Stars":4568,"Description":"Taiko Alethia based rollup protocol 🥁"}]}];
        let myChart;

        document.addEventListener('DOMContentLoaded', () => {
            
            const filteredData = groupsData.filter(g => g.GroupName === 'Overall');
            renderRepoCards(filteredData, 'default');
            updateActiveFilterButton('Overall');
            
            
            setupThemeToggle();
            setupSort();
            setupChart();
            setupFilters();
            setupBackToTopButton();
            setupLogoLink();
        });

        function renderAll() {
            renderRepoCards(groupsData, 'default');
            updateActiveFilterButton('all');
        }

        function setupThemeToggle() {
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.addEventListener('click', () => {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    html.classList.add('light');
                    themeToggle.textContent = '🌙';
                } else {
                    html.classList.remove('light');
                    html.classList.add('dark');
                    themeToggle.textContent = '☀️';
                }

                if (myChart) {
                    const newColor = getComputedStyle(document.body).getPropertyValue('--text-color');
                    myChart.options.plugins.legend.labels.color = newColor;
                    myChart.update();
                }
            });
        }
        
        function setupSort() {
            const sortBy = document.getElementById('sort-by');
            sortBy.addEventListener('change', (e) => {
                const lang = document.querySelector('.filter-btn.active').dataset.lang;
                const sortMethod = e.target.value;
                if (lang === 'all') {
                    renderRepoCards(groupsData, sortMethod);
                } else {
                    const filteredData = groupsData.filter(g => g.GroupName === lang);
                    renderRepoCards(filteredData, sortMethod);
                }
            });
        }

        function setupFilters() {
            const filtersContainer = document.getElementById('filters-container');
            groupsData.forEach(group => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.lang = group.GroupName;
                btn.textContent = group.GroupName;
                btn.addEventListener('click', () => {
                    filterByLanguage(group.GroupName);
                });
                filtersContainer.appendChild(btn);
            });

            document.querySelector('.filter-btn[data-lang="all"]').addEventListener('click', () => {
                renderAll();
                document.getElementById('sort-by').value = 'default';
            });
        }
        
        function filterByLanguage(lang) {
            const filteredData = groupsData.filter(g => g.GroupName === lang);
            renderRepoCards(filteredData, document.getElementById('sort-by').value);
            updateActiveFilterButton(lang);
        }

        function updateActiveFilterButton(lang) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.filter-btn[data-lang="${lang}"]`).classList.add('active');
        }

        function setupChart() {
            const ctx = document.getElementById('lang-chart').getContext('2d');
            const labels = groupsData.map(g => g.GroupName);
            const data = groupsData.map(g => g.Repos.length);
            const textColor = getComputedStyle(document.body).getPropertyValue('--text-color');

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Repos per language',
                        data: data,
                        backgroundColor: [
                            '#3498db', '#f1c40f', '#2ecc71', '#e74c3c', '#9b59b6',
                            '#34495e', '#1abc9c', '#e67e22', '#d35400', '#c0392b'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: textColor
                            }
                        },
                        title: {
                            display: false
                        }
                    },
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const chartElement = elements[0];
                            const lang = myChart.data.labels[chartElement.index];
                            filterByLanguage(lang);
                        }
                    }
                }
            });
        }

        function renderRepoCards(data, sortBy) {
            const repoList = document.getElementById('repo-list');
            repoList.innerHTML = '';
            
            let allRepos = data.flatMap(g => g.Repos);
            
            if (sortBy === 'stars') {
                allRepos.sort((a, b) => b.Stars - a.Stars);
            } else if (sortBy === 'name') {
                allRepos.sort((a, b) => a.Name.localeCompare(b.Name));
            }

            if(allRepos.length === 0) {
                repoList.innerHTML = '<p>No repositories found for this selection.</p>';
                return;
            }

            allRepos.forEach(repo => {
                const card = document.createElement('div');
                card.className = 'repo-card';
                card.innerHTML = `
                    <div class="repo-header">
                        <div class="repo-name">
                            <span class="repo-serial">${allRepos.indexOf(repo) + 1}.</span>
                            <a href="${repo.URL}" target="_blank">${repo.Name}</a>
                        </div>
                        <span class="repo-stars">🌟 ${repo.Stars}</span>
                    </div>
                    <div class="repo-meta">
                        ${repo.Language ? `<span class="repo-language-tag">${repo.Language}</span>` : ''}
                    </div>
                    <div class="repo-desc">${repo.Description || ''}</div>
                `;
                repoList.appendChild(card);
            });
        }

        function setupBackToTopButton() {
            const btn = document.getElementById('to-top-btn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    btn.classList.add('show');
                } else {
                    btn.classList.remove('show');
                }
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function setupLogoLink() {
            const logo = document.getElementById('logo-link');
            logo.addEventListener('click', (e) => {
                e.preventDefault();
                const filteredData = groupsData.filter(g => g.GroupName === 'Overall');
                renderRepoCards(filteredData, 'default');
                updateActiveFilterButton('Overall');
                document.getElementById('sort-by').value = 'default';
            });
        }
    </script>
