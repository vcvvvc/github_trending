            }

        header {

        .header-left {

        #logo-link {
            color: var(--text-color);
            display: flex;
            align-items: center;
        }
        #logo-link:hover {

             width: 32px;

        h1 {
            margin: 0;
            font-size: 1.5em;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        

        
        #theme-toggle {
            cursor: pointer;
            font-size: 24px;
        }

        .history-link {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.2s ease;

        .history-link:hover {
            background-color: var(--link-color);

            border-color: var(--link-color);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);

        .dashboard {

        .filters {

            transition: transform 0.3s ease-out, box-shadow 0.3s ease-out, border-color 0.3s;

        .repo-card:hover {

            align-items: baseline;
        }
        .repo-name a {
            color: var(--link-color);
            text-decoration: none;
        }
        .repo-name a:hover {
            text-decoration: underline;
        }
        
        .repo-serial {
            font-size: 1em;
            margin-right: 8px;
            opacity: 0.7;
            font-weight: normal;
        }
        
        .repo-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 8px;
            font-size: 0.9em;
            color: var(--text-color);
            opacity: 0.8;

            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 0.9em;
        }

        @media (max-width: 992px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #to-top-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(145deg, var(--link-color), var(--link-hover-color));

            height: 48px;

            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);

        #to-top-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);

        #to-top-btn:hover svg {

"Description":"✨ Agentic chat experience in your terminal. Build applications using natural language."},{"ID":92,"URL":"https://github.com/deuxfleurs-org/garage","Name":"deuxfleurs-org/garage","Language":"Rust","Stars":1555,"Description":"(Mirror) S3-compatible object store for small self-hosted geo-distributed deployments. Main repo: https://git.deuxfleurs.fr/Deuxfleurs/garage"},{"ID":93,"URL":"https://github.com/ironcalc/IronCalc","Name":"ironcalc/IronCalc","Language":"Rust","Stars":2778,"Description":"Main engine of the IronCalc ecosystem"},{"ID":94,"URL":"https://github.com/Automattic/harper","Name":"Automattic/harper","Language":"Rust","Stars":8422,"Description":"Offline, privacy-first grammar checker. Fast, open-source, Rust-powered"},{"ID":95,"URL":"https://github.com/Myriad-Dreamin/tinymist","Name":"Myriad-Dreamin/tinymist","Language":"Rust","Stars":2289,"Description":"Tinymist [ˈtaɪni mɪst] is an integrated language service for Typst [taɪpst]."},{"ID":96,"URL":"https://github.com/embassy-rs/embassy","Name":"embassy-rs/embassy","Language":"Rust","Stars":7632,"Description":"Modern embedded framework, using Rust and async."},{"ID":97,"URL":"https://github.com/openai/codex","Name":"openai/codex","Language":"Rust","Stars":48881,"Description":"Lightweight coding agent that runs in your terminal"},{"ID":98,"URL":"https://github.com/meilisearch/meilisearch","Name":"meilisearch/meilisearch","Language":"Rust","Stars":54143,"Description":"A lightning-fast search engine API bringing AI-powered hybrid search to your sites and applications."},{"ID":99,"URL":"https://github.com/tokio-rs/axum","Name":"tokio-rs/axum","Language":"Rust","Stars":23548,"Description":"Ergonomic and modular web framework built with Tokio, Tower, and Hyper"}]},{"GroupName":"Solidity","Repos":[{"ID":100,"URL":"https://github.com/OpenZeppelin/openzeppelin-contracts","Name":"OpenZeppelin/openzeppelin-contracts","Language":"Solidity","Stars":26642,"Description":"OpenZeppelin Contracts is a library for secure smart contract development."},{"ID":101,"URL":"https://github.com/Vectorized/solady","Name":"Vectorized/solady","Language":"Solidity","Stars":3131,"Description":"Optimized Solidity snippets."}]}];
        let myChart;

        document.addEventListener('DOMContentLoaded', () => {
            
            renderAll();

            
            setupThemeToggle();
            setupSort();
            setupChart();
            setupFilters();
            setupBackToTopButton();
            setupLogoLink();
        });

        function renderAll() {
            renderRepoCards(groupsData, 'default');
            updateActiveFilterButton('all');
        }

        function setupThemeToggle() {
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.addEventListener('click', () => {
                const html = document.documentElement;
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    html.classList.add('light');
                    themeToggle.textContent = '🌙';
                } else {
                    html.classList.remove('light');
                    html.classList.add('dark');
                    themeToggle.textContent = '☀️';
                }

                if (myChart) {
                    const newColor = getComputedStyle(document.body).getPropertyValue('--text-color');
                    myChart.options.plugins.legend.labels.color = newColor;
                    myChart.update();
                }
            });
        }

        function setupSort() {
            const sortBy = document.getElementById('sort-by');
            sortBy.addEventListener('change', (e) => {
                const lang = document.querySelector('.filter-btn.active').dataset.lang;
                const sortMethod = e.target.value;
                if (lang === 'all') {
                    renderRepoCards(groupsData, sortMethod);
                } else {
                    const filteredData = groupsData.filter(g => g.GroupName === lang);
                    renderRepoCards(filteredData, sortMethod);
                }
            });
        }

        function setupFilters() {
            const filtersContainer = document.getElementById('filters-container');
            groupsData.forEach(group => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.lang = group.GroupName;
                btn.textContent = group.GroupName;
                btn.addEventListener('click', () => {
                    filterByLanguage(group.GroupName);
                });
                filtersContainer.appendChild(btn);
            });

            document.querySelector('.filter-btn[data-lang="all"]').addEventListener('click', () => {
                renderAll();
                document.getElementById('sort-by').value = 'default';
            });
        }

        function filterByLanguage(lang) {
            const filteredData = groupsData.filter(g => g.GroupName === lang);
            renderRepoCards(filteredData, document.getElementById('sort-by').value);
            updateActiveFilterButton(lang);
        }

        function updateActiveFilterButton(lang) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.filter-btn[data-lang="${lang}"]`).classList.add('active');
        }

        function setupChart() {
            const ctx = document.getElementById('lang-chart').getContext('2d');
            const labels = groupsData.map(g => g.GroupName);
            const data = groupsData.map(g => g.Repos.length);
            const textColor = getComputedStyle(document.body).getPropertyValue('--text-color');

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Repos per language',
                        data: data,
                        backgroundColor: [
                            '#3498db', '#f1c40f', '#2ecc71', '#e74c3c', '#9b59b6',
                            '#34495e', '#1abc9c', '#e67e22', '#d35400', '#c0392b'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: textColor
                            }
                        },
                        title: {
                            display: false
                        }
                    },
                    onClick: (event, elements) => {
                        if (elements.length > 0) {
                            const chartElement = elements[0];
                            const lang = myChart.data.labels[chartElement.index];
                            filterByLanguage(lang);
                        }
                    }
                }
            });
        }

        function renderRepoCards(data, sortBy) {
            const repoList = document.getElementById('repo-list');
            repoList.innerHTML = '';

            let allRepos = data.flatMap(g => g.Repos);

            if (sortBy === 'stars') {
                allRepos.sort((a, b) => b.Stars - a.Stars);
            } else if (sortBy === 'name') {
                allRepos.sort((a, b) => a.Name.localeCompare(b.Name));
            }

            if(allRepos.length === 0) {
                repoList.innerHTML = '<p>No repositories found for this selection.</p>';
                return;
            }

            allRepos.forEach(repo => {
                const card = document.createElement('div');
                card.className = 'repo-card';
                card.innerHTML = `
                    <div class="repo-header">
                        <div class="repo-name">
                            <span class="repo-serial">${allRepos.indexOf(repo) + 1}.</span>
                            <a href="${repo.URL}" target="_blank">${repo.Name}</a>
                        </div>
                        <span class="repo-stars">🌟 ${repo.Stars}</span>
                    </div>
                    <div class="repo-meta">
                        ${repo.Language ? `<span class="repo-language-tag">${repo.Language}</span>` : ''}
                    </div>
                    <div class="repo-desc">${repo.Description || ''}</div>
                `;
                repoList.appendChild(card);
            });
        }

        function setupBackToTopButton() {
            const btn = document.getElementById('to-top-btn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    btn.classList.add('show');
                } else {
                    btn.classList.remove('show');
                }
            });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function setupLogoLink() {
            const logo = document.getElementById('logo-link');
            logo.addEventListener('click', (e) => {
                e.preventDefault();
                renderAll();
                document.getElementById('sort-by').value = 'default';
            });
        }
    </script>
</body>
</html>
